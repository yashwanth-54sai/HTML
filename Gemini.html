<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body { font-family: sans-serif; }
        table { border-collapse: collapse; }
        td { padding: 5px; vertical-align: top; }
        .qual-table td { border: 1px solid #ccc; padding: 2px; }
        .qual-table th { font-weight: bold; text-align: left; }
    </style>
   
</head>
<body>
    <Center>
    <form>
        <table border="2px" cellspacing="5px" cellpadding="5px" height="200px" weight="200px">
            <tr>
                <td>First Name :</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Last Name :</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" id="male"> <label for="male">male</label>
                    <input type="radio" name="gender" id="female"> <label for="female">female</label>
                </td>
            </tr>
            <tr>
                <td>Email ID :</td>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td>Mobile No</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Address</td>
                <td><textarea rows="3" cols="22"></textarea></td>
            </tr>
            <tr>
                <td>City</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>PINCODE</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>STATE</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Country</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Hobbies</td>
                <td>
                    <input type="checkbox"> Drawing
                    <input type="checkbox"> Singing
                    <input type="checkbox"> Dancing <br>
                    <input type="checkbox"> Other <input type="text">
                </td>
            </tr>

            <tr>
                <td>Qualifications</td>
                <td>
                    <table class="qual-table">
                        <tr>
                            <th>sl no</th>
                            <th>Qualification</th>
                            <th>Year of Passing</th>
                            <th>Percentage</th>
                        </tr>
                        <tr>
                            <td>1</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td>4</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr>
                <td>Cources</td>
                <td>
                    <input type="radio" name="course"> B.Tech
                    <input type="radio" name="course"> B.Com
                    <input type="radio" name="course"> BSC
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
